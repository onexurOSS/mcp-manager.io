name: cla

# Records acceptance of the Onexur Contributor License Agreement (CLA.md).
#
# Acceptance is affirmative only. A contributor must post the exact sentence in
# custom-pr-sign-comment on the pull request. Opening a pull request does not
# count, and the bot never treats silence as agreement.
#
# Signatures are stored in the cla-signatures branch, in a file whose path carries
# the CLA version. Each record holds the GitHub username and id, the pull request
# number, the comment id, the timestamps and the comment text, which names the
# version. When CLA.md is revised, change path-to-signatures (for example to
# signatures/v2.0/cla.json) and the sign sentence together, so that earlier
# signatures never count for the new version and nothing is re-applied to merged
# pull requests. Do not edit the version 1.0 file. Pull requests are locked after
# merge so that signature comments cannot be edited or withdrawn afterwards.
#
# The action does not record a hash of CLA.md. To tie signatures to the exact
# text, point path-to-document at a tag or commit permalink for the version (for
# example a cla-v1.0 tag) once one exists.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read and agree to the Onexur Contributor License Agreement, Version 1.0'
    steps:
      - name: CLA Assistant
        # contributor-assistant/github-action v2.6.1, pinned to its commit
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/onexurOSS/mcp-manager.io/blob/main/CLA.md
          path-to-signatures: signatures/v1.0/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: true
          custom-pr-sign-comment: I have read and agree to the Onexur Contributor License Agreement, Version 1.0
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before it can be merged, you must
            read and agree to the Onexur Contributor License Agreement (Version 1.0),
            maintained by Xalterra Ltd, trading as Onexur. Its full text is in
            [CLA.md](https://github.com/onexurOSS/mcp-manager.io/blob/main/CLA.md).
            Submitting a pull request does not by itself accept it. To agree, post
            a comment on this pull request containing exactly the sentence below.
          custom-allsigned-prcomment: All contributors on this pull request have agreed to the Onexur Contributor License Agreement, Version 1.0.
          signed-commit-message: "@$contributorName agreed to the Onexur CLA Version 1.0 in $owner/$repo"
          create-file-commit-message: Create the CLA signatures file for Version 1.0
